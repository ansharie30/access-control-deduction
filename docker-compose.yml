services:
  app:
    build:
      context: ./docker/php
      args:
        UID: 1000
        GID: 1000
    image: api_app
    container_name: access_control_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: access_control_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: access_control_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: access_control
      MYSQL_ROOT_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: